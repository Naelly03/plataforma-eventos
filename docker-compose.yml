services:
  db:
    image: postgres:16
    container_name: eventos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos123
      POSTGRES_DB: eventos
    ports:
      - "5442:5432"
    volumes:
      - eventos_data:/var/lib/postgresql/data

volumes:
  eventos_data: